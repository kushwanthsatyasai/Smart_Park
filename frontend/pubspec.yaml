name: smart_park
description: A smart parking management system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  flutter_dotenv: ^5.1.0
  qr_code_scanner: ^0.4.0
  permission_handler: ^10.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  mobile_scanner: ^3.5.6
  fl_chart: ^0.65.0
  screenshot: ^2.1.0
  shared_preferences: ^2.2.2
  universal_html: ^2.2.4
  provider: ^6.0.5
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - .env 