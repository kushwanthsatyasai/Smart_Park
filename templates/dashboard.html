
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            margin: 0;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body {
            padding: 15px;
        }
        .stream-container {
            position: relative;
        }
        .stream-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .live-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        .live-dot {
            width: 12px;
            height: 12px;
            background: #f00;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .status {
            margin-top: 10px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-label {
            font-weight: bold;
        }
        .status-value {
            color: #3498db;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .badge-success {
            background: #2ecc71;
            color: white;
        }
        .badge-danger {
            background: #e74c3c;
            color: white;
        }
        .badge-warning {
            background: #f39c12;
            color: white;
        }
        .badge-info {
            background: #3498db;
            color: white;
        }
        #clock {
            font-size: 18px;
            font-weight: bold;
            color: #7f8c8d;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Parking Dashboard</h1>
            <div id="clock">00:00:00</div>
        </header>
        
        <div class="dashboard">
            <div class="main-content">
                <div class="card">
                    <div class="card-header">
                        <span>Live Camera Feed</span>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div class="stream-container">
                            <img src="/video_feed" id="videoFeed" alt="Camera Feed">
                            <div class="live-indicator">
                                <div class="live-dot"></div>
                                <span>LIVE</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="card">
                    <div class="card-header">
                        <span>Current Status</span>
                    </div>
                    <div class="card-body">
                        <div class="status">
                            <div class="status-item">
                                <span class="status-label">QR Detection:</span>
                                <span class="status-value" id="qrStatus">No QR detected</span>
                            </div>
                            <div class="status-item">
                                <span class="status-label">Booking ID:</span>
                                <span class="status-value" id="bookingId">-</span>
                            </div>
                            <div class="status-item">
                                <span class="status-label">Slot Number:</span>
                                <span class="status-value" id="slotNumber">-</span>
                            </div>
                            <div class="status-item">
                                <span class="status-label">Verification:</span>
                                <span class="badge badge-warning" id="verificationStatus">Pending</span>
                            </div>
                            <div class="status-item">
                                <span class="status-label">Gate Status:</span>
                                <span class="badge badge-info" id="gateStatus">Closed</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span>System Info</span>
                    </div>
                    <div class="card-body">
                        <div class="status">
                            <div class="status-item">
                                <span class="status-label">Server Status:</span>
                                <span class="badge badge-success">Online</span>
                            </div>
                            <div class="status-item">
                                <span class="status-label">Last Updated:</span>
                                <span class="status-value" id="lastUpdated">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Smart Parking System &copy; 2023</p>
        </footer>
    </div>

    <script>
        // Update clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Reload video feed periodically to prevent freezing
        setInterval(() => {
            const videoFeed = document.getElementById('videoFeed');
            videoFeed.src = '/video_feed?' + new Date().getTime();
        }, 30000);

        // Update status information
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const now = new Date();
                    document.getElementById('lastUpdated').textContent = now.toTimeString().split(' ')[0];
                    
                    if (data.latest_result) {
                        const result = data.latest_result;
                        
                        // Update QR status
                        if (result.qr_found) {
                            document.getElementById('qrStatus').textContent = 'QR Detected';
                            document.getElementById('bookingId').textContent = result.booking_id || '-';
                            document.getElementById('slotNumber').textContent = result.slot_number || '-';
                            
                            // Update verification status
                            const verificationStatus = document.getElementById('verificationStatus');
                            if (result.valid_booking) {
                                verificationStatus.textContent = 'Valid';
                                verificationStatus.className = 'badge badge-success';
                            } else {
                                verificationStatus.textContent = 'Invalid';
                                verificationStatus.className = 'badge badge-danger';
                            }
                            
                            // Update gate status
                            const gateStatus = document.getElementById('gateStatus');
                            if (result.open_gate) {
                                gateStatus.textContent = 'Open';
                                gateStatus.className = 'badge badge-success';
                            } else {
                                gateStatus.textContent = 'Closed';
                                gateStatus.className = 'badge badge-info';
                            }
                        } else {
                            document.getElementById('qrStatus').textContent = 'No QR detected';
                            document.getElementById('bookingId').textContent = '-';
                            document.getElementById('slotNumber').textContent = '-';
                            document.getElementById('verificationStatus').textContent = 'Pending';
                            document.getElementById('verificationStatus').className = 'badge badge-warning';
                            document.getElementById('gateStatus').textContent = 'Closed';
                            document.getElementById('gateStatus').className = 'badge badge-info';
                        }
                    }
                })
                .catch(error => console.error('Error fetching status:', error));
        }
        
        // Update status every 2 seconds
        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
